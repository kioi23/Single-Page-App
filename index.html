<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VibeSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

<header class="p-4 text-center text-2xl font-bold">
  🎧 VibeSync
  <a href="saved.html" class="text-sm ml-4 text-red-400">Saved Songs</a>
</header>

<section class="p-4 text-center">
  <select id="moodSelect" class="p-2 text-black">
    <option value="">Select Mood</option>
    <option value="happy">Happy</option>
    <option value="sad">Sad</option>
    <option value="chill">Chill</option>
    <option value="focus">Focus</option>
    <option value="energy">Energetic</option>
  </select>

  <button id="searchBtn" class="bg-red-500 px-4 py-2 ml-2">
    Find Music
  </button>
</section>

<!-- Loading / Error -->
<p id="statusMsg" class="text-center"></p>

<main id="results" class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4"></main>

<!-- Only ONE script with module -->
<script type="module" src="app.js"></script>

</body>
</html>
